version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: DOCKER-MYSQL
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Risenme@20
      MYSQL_DATABASE: student_perf
    ports:
      - "3307:3306"
    networks:
      - app-network

  php:
    image: php:8.2-apache
    container_name: php-backend
    command: sh -c "docker-php-ext-install mysqli && apache2-foreground"
    volumes:
      - ./Stud_Perf:/var/www/html
    ports:
      - "8081:80"
    networks:
      - app-network
    depends_on:
      - mysql

  react:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
    networks:
      - app-network
    depends_on:
      - php

networks:
  app-network:
    driver: bridge