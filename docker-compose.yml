services:
  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Risenme@20
      MYSQL_DATABASE: student_perf
    ports:
      - "3307:3306"
    networks:
      - app-network

  php:
    image: php:8.2-apache
    command: sh -c "chmod -R 755 /var/www/html && docker-php-ext-install mysqli && apache2-foreground"
    volumes:
      - ./Stud_Perf:/var/www/html
    ports:
      - "8081:80"
    networks:
      - app-network
    depends_on:
      - mysql

  react:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_PORT=5173
      - WATCHPACK_POLLING=true # Helps Docker see file changes on Windows
    networks:
      - app-network
    depends_on:
      - php
networks:
  app-network:
    driver: bridge